<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tic concept chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { --bg:#111418; --panel:#1a1f26; --fg:#e6e8eb; --dim:#8b949e; --accent:#f59e0b; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         background:var(--bg); color:var(--fg);
         font:15px/1.55 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center;
           padding:10px 16px; background:var(--panel); border-bottom:1px solid #2b3138; }
  header h1 { font-size:15px; margin:0; }
  header h1 small { color:var(--dim); font-weight:normal; margin-left:8px; }
  header button { margin-left:8px; }
  button { background:#2b3138; color:var(--fg); border:1px solid #3a4149;
           border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  main { flex:1; overflow-y:auto; padding:16px; }
  .msg { max-width:860px; margin:0 auto 14px; padding:10px 14px; border-radius:8px; }
  .msg.user { background:#22303c; white-space:pre-wrap; }
  .msg.assistant { background:var(--panel); }
  .msg pre { background:#0d1117; padding:10px; border-radius:6px; overflow-x:auto; }
  .msg code { font:13px/1.5 Consolas, monospace; }
  details { margin-bottom:8px; color:var(--dim); }
  details pre { white-space:pre-wrap; font-size:13px; }
  sup.cite { color:var(--accent); font-weight:600; cursor:default; }
  .sources { margin-top:10px; padding-top:8px; border-top:1px solid #2b3138; }
  .sources-h { color:var(--accent); font-size:12px; text-transform:uppercase;
               letter-spacing:.04em; margin-bottom:4px; }
  .source { font-size:13px; margin-bottom:4px; }
  .source-n { color:var(--accent); font-weight:600; }
  .source-title { color:var(--dim); }
  .source-quote { color:var(--fg); }
  .usage { color:var(--dim); font-size:12px; margin-top:6px; }
  .error { color:#f85149; }
  footer { display:flex; gap:8px; padding:12px 16px; background:var(--panel);
           border-top:1px solid #2b3138; }
  textarea { flex:1; resize:none; background:#0d1117; color:var(--fg);
             border:1px solid #3a4149; border-radius:6px; padding:8px; font:inherit; }
</style>
</head>
<body>
<header>
  <h1>tic concept chat
    <small>claude-opus-4-8 · README + CONTRACT + CONTRACT-DURABILITY · cited</small></h1>
  <div>
    <button id="export">Export .md</button>
    <button id="reset">New conversation</button>
  </div>
</header>
<main id="log"></main>
<footer>
  <textarea id="input" rows="3"
    placeholder="Ask about the gate's concepts... (Ctrl+Enter to send)"></textarea>
  <button id="send">Send</button>
</footer>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
// Full record for display + export (includes cites). The API payload is
// derived from this as {role, content} only.
let history = [];
let busy = false;

function addBubble(role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  log.appendChild(div);
  return div;
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = '';
  history.push({role: 'user', content: text});
  addBubble('user').textContent = text;

  const bubble = addBubble('assistant');
  const think = document.createElement('details');
  think.innerHTML = '<summary>thinking…</summary><pre></pre>';
  const body = document.createElement('div');
  const sourcesEl = document.createElement('div');
  sourcesEl.className = 'sources';
  bubble.append(think, body, sourcesEl);

  // answer = clean text (history + API + export). display = answer with
  // inline [n] markers. cites = ordered anchors into the contracts.
  let answer = '', display = '', thinking = '';
  const cites = [];

  function renderSources() {
    sourcesEl.innerHTML = '';
    if (!cites.length) return;
    const h = document.createElement('div');
    h.className = 'sources-h';
    h.textContent = 'Sources';
    sourcesEl.appendChild(h);
    cites.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'source';
      const n = document.createElement('span');
      n.className = 'source-n'; n.textContent = `[${i + 1}] `;
      const t = document.createElement('span');
      t.className = 'source-title'; t.textContent = c.title + ': ';
      const q = document.createElement('span');
      q.className = 'source-quote'; q.textContent = '"' + c.text + '"';
      row.append(n, t, q);
      sourcesEl.appendChild(row);
    });
  }

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: history.map(m => ({role: m.role, content: m.content}))}),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'thinking') {
          thinking += ev.text;
          think.querySelector('pre').textContent = thinking;
        } else if (ev.type === 'text') {
          answer += ev.text;
          display += ev.text;
          body.innerHTML = marked.parse(display);
        } else if (ev.type === 'citation') {
          cites.push({title: ev.title, text: ev.text});
          display += ` <sup class="cite">[${cites.length}]</sup>`;
          body.innerHTML = marked.parse(display);
          renderSources();
        } else if (ev.type === 'error') {
          const p = document.createElement('p');
          p.className = 'error';
          p.textContent = ev.message;
          bubble.appendChild(p);
        } else if (ev.type === 'done') {
          const u = ev.usage;
          const p = document.createElement('p');
          p.className = 'usage';
          p.textContent = `in ${u.input_tokens} / out ${u.output_tokens} / ` +
            `cache write ${u.cache_creation_input_tokens} / cache read ${u.cache_read_input_tokens}`;
          bubble.appendChild(p);
        }
      }
      log.scrollTop = log.scrollHeight;
    }
  } catch (e) {
    const p = document.createElement('p');
    p.className = 'error';
    p.textContent = 'stream failed: ' + e;
    bubble.appendChild(p);
  }
  if (!thinking) think.remove();
  if (answer) history.push({role: 'assistant', content: answer, cites});
  busy = false; sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); send(); }
});

document.getElementById('reset').addEventListener('click', () => {
  history = [];
  log.innerHTML = '';
  input.focus();
});

document.getElementById('export').addEventListener('click', () => {
  if (!history.length) return;
  const md = history.map(m => {
    let block = (m.role === 'user' ? '## You\n\n' : '## Opus\n\n') + m.content;
    if (m.cites && m.cites.length) {
      block += '\n\n**Sources:**\n' +
        m.cites.map((c, i) => `${i + 1}. *${c.title}*: "${c.text}"`).join('\n');
    }
    return block;
  }).join('\n\n---\n\n');
  const stamp = new Date().toISOString().slice(0, 16).replace('T', '-').replace(':', '');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], {type: 'text/markdown'}));
  a.download = `tic-chat-${stamp}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
});

input.focus();
</script>
</body>
</html>
